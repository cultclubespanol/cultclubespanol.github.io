<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cult Club · A1 · Sustantivos y artículos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF2A85;--blue:#0013F6;--ink:#12122B;--muted:#6B6B85;--bg:#F6F5FB;--card:#fff;--line:#E6E4F0;--ok:#0BA46A;--okbg:#E6F7EF;--bad:#E5245F;--badbg:#FFE8EF;--warn:#B26A00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}
.hero{background:#ECEEFE;border-radius:0 0 28px 28px;margin:0 -16px;padding:22px 20px 0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#FFD6E7;right:-80px;top:-100px}
.brand{position:relative;z-index:1;font-family:Unbounded;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);text-decoration:none}
.brand span{color:#fff;background:var(--pink);border-radius:6px;padding:2px 6px;margin-left:6px}
.hero-row{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px;margin-top:14px}
.hero-txt{flex:1;padding-bottom:22px}
.tag{display:inline-block;font-size:12px;font-weight:600;background:#fff;color:var(--blue);border-radius:99px;padding:4px 10px;margin-bottom:10px}
.hero h1{font-family:Unbounded;font-size:22px;line-height:1.2;margin:0 0 8px;font-weight:700}
.hero p{margin:0;color:var(--muted);font-size:14px}
.hero img{width:140px;flex:none;margin-right:-10px;margin-bottom:-4px}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-top:16px;border:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);margin:0}
.reset{margin-top:10px;background:none;border:none;color:var(--pink);font:600 14px Onest,sans-serif;padding:0;cursor:pointer;text-decoration:underline}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--pink)}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px}
.prog-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--pink));transition:width .25s}
.ex{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.ex-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.ex-n{font-family:Unbounded;font-weight:800;font-size:13px;color:#fff;background:var(--blue);border-radius:10px;min-width:30px;height:30px;display:grid;place-items:center;flex:none}
.ex-t{font-weight:600;font-size:16px;padding-top:4px}
.row{padding:10px 8px;margin:0 -8px;border-top:1px dashed var(--line);border-radius:12px}
.w{font-size:17px;font-weight:600}
.tr{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px;display:none}
body.show-tr .tr{display:inline}
.slot{color:var(--blue);font-weight:700;display:inline-block;min-width:34px;border-bottom:2px solid var(--blue);text-align:center;margin-right:6px}
.chips{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;font-family:Unbounded;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.row.inline{display:flex;align-items:center;gap:10px}
.row.inline .w{flex:1}
.row.inline .chips{margin-top:0;flex:none;gap:6px}
.row.inline .chip{padding:9px 8px;font-size:12px;min-width:46px}
.in{width:100%;margin-top:6px;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;outline:none;background:#fff}
.in:focus{border-color:var(--blue)}
.row.ok{background:var(--okbg)}
.row.bad{background:var(--badbg)}
.row.ok .chip.sel{background:var(--ok);border-color:var(--ok)}
.row.bad .chip.sel{background:var(--bad);border-color:var(--bad)}
.row.ok .in{border-color:var(--ok)}
.row.bad .in{border-color:var(--bad)}
.row.done .chip,.row.done .in{pointer-events:none}
.row.inline.done{flex-wrap:wrap}
.fb{display:none;width:100%;font-size:14px;margin-top:8px}
.row.done .fb{display:block}
.fb .warn{color:var(--warn)}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(246,245,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock .inr{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font-family:Unbounded;font-weight:700;font-size:14px;border:none;border-radius:14px;padding:15px 14px;cursor:pointer}
.btn.main{background:var(--pink);color:#fff}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.hint{font-size:13px;color:var(--bad);text-align:center;margin:6px 0 0;min-height:16px}
.result{display:none;margin-top:18px;background:var(--card);border-radius:24px;border:1px solid var(--line);overflow:hidden;scroll-margin-top:70px}
.result.on{display:block}
.res-head{background:var(--pink);color:#fff;padding:20px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.res-head:after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;background:var(--blue);right:-60px;bottom:-90px}
.res-head img{width:104px;flex:none;position:relative;z-index:1;background:#fff;border-radius:50%;padding:6px}
.res-head .sc{position:relative;z-index:1}
.score-n{font-family:Unbounded;font-size:38px;font-weight:800;line-height:1}
.score-n small{font-size:18px;opacity:.8}
.score-t{font-size:15px;margin-top:6px;font-weight:500}
.res-body{padding:18px}
.res-body h2{font-family:Unbounded;font-size:15px;margin:0 0 10px}
.err{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.err:last-child{border-bottom:none}
.err .n{font-family:Unbounded;font-size:11px;color:var(--muted);min-width:34px;padding-top:2px}
.err .was{color:var(--bad);text-decoration:line-through}
.err .is{color:var(--ok);font-weight:700}
.err p{margin:3px 0 0;color:var(--muted)}
.rules{margin-top:16px;background:#EEF0FF;border-radius:16px;padding:14px 16px;font-size:14px}
.rules b{color:var(--blue)}
.rules ul{margin:6px 0 0;padding-left:18px}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.confirm{display:none;background:#FFF0F6;border:1px solid #FFC2DB;border-radius:14px;padding:12px;font-size:14px;margin-top:10px}
.confirm.on{display:block}
.confirm .row2{display:flex;gap:10px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <a class="brand" href="./">Cult Club <span>Español</span></a>
    <div class="hero-row">
      <div class="hero-txt">
        <div class="tag">Libro A1 · стр. 9, упр. 1–5</div>
        <h1>Sustantivos y artículos</h1>
        <p>Существительные и артикли. Ответь на всё и нажми «Проверить».</p>
      </div>
      <img src="assets/capy-study.webp" alt="Капибара делает домашку">
    </div>

  <div class="panel">

    <label class="sw" id="trWrap"><input type="checkbox" id="trToggle"> Показать перевод слов</label>
    <button class="reset" id="topClear">Начать заново</button>
    <div class="confirm" id="confirm">Стереть все ответы на этом устройстве? Вернуть их будет нельзя.
      <div class="row2"><button class="btn main" id="yesClear">Стереть</button><button class="btn ghost" id="noClear">Отмена</button></div>
    </div>
  </div>

  <div class="sticky">
    <div class="prog-top"><span id="progTxt"></span><span id="progPct"></span></div>
    <div class="bar"><i id="progBar"></i></div>
  </div>

  <div id="exs"></div>

  <section class="result" id="result">
    <div class="res-head">
      <img id="resImg" src="assets/capy-study.webp" alt="Капибара">
      <div class="sc"><div class="score-n" id="scoreN"></div><div class="score-t" id="scoreT"></div></div>
    </div>
    <div class="res-body">
      <div id="errBox"></div>
      
      <div class="acts">
        <button class="btn main" id="fixBtn">Исправить ошибки</button>
        <button class="btn ghost" id="resetBtn">Пройти заново</button>
      </div>
    </div>
  </section>
</div>

<div class="dock" id="dock">
  <div class="inr"><button class="btn main" id="checkBtn">Проверить</button></div>
  <p class="hint" id="hint"></p>
</div>

const KEY="ccv2_"+PAGE_ID;
let st={a:{},checked:false};
try{const s=localStorage.getItem(KEY); if(s) st=Object.assign(st,JSON.parse(s));}catch(e){}
const $=id=>document.getElementById(id);
const ITEMS=[]; EXERCISES.forEach((e,ei)=>e.items.forEach((it,ii)=>ITEMS.push({e,ei,ii,it,k:ei+"_"+ii})));
const total=ITEMS.length;
if(!ITEMS.some(x=>x.it.tr)) $("trWrap").style.display="none";
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){} progress();}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const norm=s=>String(s||"").toLowerCase().replace(/[¡!¿?.,;:]/g," ").replace(/\s+/g," ").trim();
const plain=s=>norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"");
function grade(x){
  const v=st.a[x.k]||"";
  if(x.e.type==="choice") return {ok:x.it.ok.includes(v)};
  const n=norm(v), p=plain(v);
  for(const o of x.it.ok){ if(norm(o)===n) return {ok:true}; }
  for(const o of x.it.ok){ if(plain(o)===p) return {ok:true,accent:o}; }
  return {ok:false};
}
function shown(x){ return x.e.type==="choice" ? (x.e.slot?`${st.a[x.k]||"___"} ${x.it.w}`:`${x.it.w}: ${st.a[x.k]||"___"}`) : (st.a[x.k]||"(пусто)"); }
function right(x){ return x.e.type==="choice" ? (x.e.slot?`${x.it.ok.join(" / ")} ${x.it.w}`:`${x.it.w}: ${x.it.ok.join(" / ")}`) : x.it.ok.slice(0,3).join(" / "); }
function render(){
  $("exs").innerHTML=EXERCISES.map((e,ei)=>`
   <section class="ex"><div class="ex-h"><span class="ex-n">${ei+1}</span><span class="ex-t">${e.t}</span></div>
   ${e.items.map((it,ii)=>{
     const k=ei+"_"+ii, v=st.a[k]||"", tr=it.tr?`<span class="tr">${it.tr}</span>`:"";
     if(e.type==="choice") return `<div class="row${e.options.length<=2?" inline":""}" id="r${k}"><div class="w">${e.slot?`<span class="slot" id="s${k}">${esc(v)||"&nbsp;"}</span>`:""}${it.w}${tr}</div>
       <div class="chips">${e.options.map(o=>`<button class="chip${v===o?" sel":""}" data-k="${k}" data-v="${o}">${o}</button>`).join("")}</div><div class="fb" id="f${k}"></div></div>`;
     return `<div class="row" id="r${k}"><div class="w">${it.w}${tr}</div><input class="in" data-k="${k}" value="${esc(v)}" placeholder="${e.ph||""}" autocapitalize="off" autocomplete="off" spellcheck="false"><div class="fb" id="f${k}"></div></div>`;
   }).join("")}</section>`).join("");
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest(".chip"); if(!b) return;
  const k=b.dataset.k; if($("r"+k).classList.contains("done")) return;
  st.a[k]= st.a[k]===b.dataset.v ? "" : b.dataset.v;
  b.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel",c.dataset.v===st.a[k]));
  const s=$("s"+k); if(s) s.innerHTML=esc(st.a[k])||"&nbsp;";
  $("hint").textContent=""; save();
});
document.addEventListener("input",ev=>{const i=ev.target; if(i.dataset.k){st.a[i.dataset.k]=i.value; $("hint").textContent=""; save();}});
function filled(){return ITEMS.filter(x=>(st.a[x.k]||"").trim()).length}
function progress(){const n=filled(),p=Math.round(n/total*100); $("progTxt").textContent=`Отвечено ${n} из ${total}`; $("progPct").textContent=p+"%"; $("progBar").style.width=p+"%";}
function paint(){
  let score=0; const errs=[];
  ITEMS.forEach(x=>{
    const r=$("r"+x.k), g=grade(x);
    r.classList.remove("ok","bad"); r.classList.add("done",g.ok?"ok":"bad");
    const ex=x.it.ex?` ${x.it.ex}`:"";
    $("f"+x.k).innerHTML = g.ok
      ? (g.accent?`<b>Верно.</b> <span class="warn">Проверь ударение: ${esc(g.accent)}</span>`:`<b>Верно.</b>`)
      : `<b>Правильно: ${esc(right(x))}.</b>${ex}`;
    if(g.ok) score++; else errs.push(x);
  });
  return {score,errs};
}
function verdict(s){const r=s/total; if(r===1) return "Perfecto! Ни одной ошибки."; if(r>=.85) return "¡Muy bien! Почти идеально."; if(r>=.6) return "Bien. Ошибки разобраны ниже."; return "Vamos de nuevo. Посмотри разбор и исправь.";}
function showResult(){
  const {score,errs}=paint();
  $("scoreN").innerHTML=`${score}<small>/${total}</small>`;
  $("scoreT").textContent=verdict(score);
  $("resImg").src= score/total>=.85?"assets/capy-success.webp":"assets/capy-study.webp";
  $("errBox").innerHTML = errs.length
    ? `<h2>Ошибки: ${errs.length}</h2>`+errs.map(x=>`<div class="err"><span class="n">${x.ei+1}.${x.ii+1}</span><div>${x.e.type==="text"?`${esc(x.it.w)}: `:""}<span class="was">${esc(shown(x))}</span> → <span class="is">${esc(right(x))}</span>${x.it.ex?`<p>${x.it.ex}</p>`:""}</div></div>`).join("")
    : `<p style="margin:0">Все ответы верные. Можно переходить к следующему заданию.</p>`;
  $("fixBtn").style.display=errs.length?"block":"none";
  $("result").classList.add("on"); $("dock").style.display="none";
}
$("checkBtn").onclick=()=>{
  const empty=ITEMS.filter(x=>!(st.a[x.k]||"").trim());
  if(empty.length){
    $("hint").textContent=`Осталось ответить: ${empty.length}. Первый пропуск: упр. ${empty[0].ei+1}, № ${empty[0].ii+1}`;
    $("r"+empty[0].k).scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  st.checked=true; save(); showResult(); $("result").scrollIntoView({behavior:"smooth",block:"start"});
};
$("fixBtn").onclick=()=>{
  const bad=ITEMS.filter(x=>!grade(x).ok);
  bad.forEach(x=>{st.a[x.k]="";});
  st.checked=false; save(); render(); $("result").classList.remove("on"); $("dock").style.display="block";
  ITEMS.filter(x=>!bad.includes(x)).forEach(x=>{const r=$("r"+x.k); r.classList.add("done","ok"); $("f"+x.k).innerHTML="<b>Верно.</b>";});
  $("r"+bad[0].k).scrollIntoView({behavior:"smooth",block:"center"});
};
function clearAll(){st={a:{},checked:false}; save(); render(); $("result").classList.remove("on"); $("dock").style.display="block"; window.scrollTo({top:0,behavior:"smooth"});}
$("resetBtn").onclick=clearAll;
$("topClear").onclick=()=>$("confirm").classList.add("on");
$("noClear").onclick=()=>$("confirm").classList.remove("on");
$("yesClear").onclick=()=>{$("confirm").classList.remove("on"); clearAll();};
$("trToggle").onchange=e=>document.body.classList.toggle("show-tr",e.target.checked);
render(); progress(); if(st.checked) showResult();
</script>
</body>
</html>
