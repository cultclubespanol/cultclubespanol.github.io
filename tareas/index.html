<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cult Club Español · Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#FF2A85;--blue:#0013F6;--ink:#12122B;--muted:#6B6B85;--bg:#F6F5FB;--line:#E6E4F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
.hero{background:#ECEEFE;border-radius:0 0 28px 28px;margin:0 -16px;padding:22px 20px 0;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#FFD6E7;right:-80px;top:-100px}
.brand{position:relative;z-index:1;font-family:Unbounded;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
.brand span{color:#fff;background:var(--pink);border-radius:6px;padding:2px 6px;margin-left:6px}
.row{position:relative;z-index:1;display:flex;align-items:flex-end;gap:8px;margin-top:14px}
.txt{flex:1;padding-bottom:22px}
h1{font-family:Unbounded;font-size:24px;line-height:1.2;margin:0 0 8px}
.txt p{margin:0;color:var(--muted);font-size:14px}
.row img{width:140px;margin-right:-10px;margin-bottom:-4px}
h2{font-family:Unbounded;font-size:14px;margin:26px 0 10px;color:var(--muted);font-weight:700}
.card{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);margin-bottom:10px;transition:border-color .15s}
.card:hover{border-color:var(--blue)}
.lvl{font-family:Unbounded;font-weight:700;font-size:12px;color:var(--blue);background:#EEF0FF;border-radius:8px;padding:6px 8px;flex:none}
.card b{display:block;font-size:16px}
.card small{color:var(--muted);font-size:13px}
.go{margin-left:auto;font-family:Unbounded;color:var(--pink);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">Cult Club <span>Español</span></div>
    <div class="row">
      <div class="txt">
        <h1>Tareas</h1>
        <p>Домашние задания онлайн-группы. Выбери задание, отвечай прямо на странице и в конце отправь результат педагогу.</p>
      </div>
      <img src="assets/capy-study.webp" alt="Капибара делает домашку">
    </div>
  </header>

  <h2>Gramática</h2>
  <!-- Новое задание: скопируй блок <a class="card">...</a> и поменяй ссылку и текст -->
  <a class="card" href="articulos.html">
    <span class="lvl">A1</span>
    <span><b>Los artículos</b><small>Артикли el, la, los, las · 20 слов</small></span>
    <span class="go">→</span>
  </a>
</div>
</body>
</html>
